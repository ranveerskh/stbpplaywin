name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test and validate sources
        run: npm test
      - name: Build Windows installer without publishing
        run: npm run desktop:make
      - name: Upload Windows test installer for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stb-play-windows-test-v1.8.26
          path: release/Netplus-IPTV-Player-Setup-1.8.26.exe
          if-no-files-found: error
          retention-days: 14
